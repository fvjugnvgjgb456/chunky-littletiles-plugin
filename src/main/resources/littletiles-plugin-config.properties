# ============================================
# LittleTiles Plugin Configuration
# ============================================
# This file controls logging verbosity and plugin features.
# Location: ~/.chunky/plugins/littletiles-plugin-config.properties
# Restart Chunky after modifying this file for changes to take effect.
#
# Default values match the original DebugConfig hardcoded settings.
# ============================================

# ==== File Logging ====

# Enable file logging output (default: true)
# When false, logs only go to Chunky console (no littletiles-plugin.log file)
# This is useful to avoid generating large log files during debugging.
ENABLE_FILE_LOGGING=true

# ==== Verbose Logging Options ====
# WARNING: Enabling these options can generate very large log files (100+ MB)
# in scenes with many LittleTiles entities. Use only for targeted debugging.

# Enable detailed NBT parser logs (default: false)
# Logs every tile parsed, including blockstate, box data, and color.
# WARNING: Generates 100+ MB logs in large scenes (227K entities).
VERBOSE_NBT_PARSER=false

# Enable detailed entity construction logs (default: false)
# Logs entity creation, tile counts, and coordinate information.
VERBOSE_ENTITY_CONSTRUCTION=false

# Enable verbose primitive generation logs (default: false)
# Logs each box's AABB, grid coordinates, and corner offsets.
# Useful for debugging TransformableBox geometry issues.
VERBOSE_PRIMITIVE_GENERATION=false

# Enable verbose box parsing logs (default: false)
# Logs raw box data arrays to diagnose NBT parsing issues.
# Shows the exact field values before interpretation.
VERBOSE_BOX_PARSING=false

# ==== Performance & Statistics ====

# Enable performance timing logs (default: true)
# Records per-entity and per-tile build times.
# Prints performance report at plugin shutdown.
ENABLE_PERFORMANCE_TIMING=true

# Enable summary statistics (default: false)
# Logs tile counts, primitive counts, and blockstate summaries per entity.
# WARNING: Generates ~30KB per 1000 entities in large scenes.
ENABLE_SUMMARY_STATS=false

# ==== Warning Messages ====

# Enable warning messages (default: false)
# Shows warnings for invalid data, parse failures, and unsupported features.
# WARNING: Each warning triggers a GUI popup dialog in Chunky.
# Only enable this when actively debugging issues.
ENABLE_WARNINGS=false

# ==== Feature Toggles ====

# Enable TransformableBox support (default: true)
# When false, all 7+ field boxes are treated as basic AABB (C1-C6 behavior).
# This can be used to disable advanced geometry (C7) for testing or compatibility.
# Disabling this will cause sloped/beveled/transformed tiles to render as cubes.
ENABLE_TRANSFORMABLE_BOX=true

# ============================================
# End of Configuration
# ============================================
